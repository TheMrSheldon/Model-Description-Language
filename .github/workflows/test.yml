name: Run C++ Tests, Linters, and Format Checks

on:
  push:

jobs:
  tests:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macOS arm64
            os: macos-latest
            arch: arm64
          - name: macOS x86_64
            os: macos-13
            arch: x86_64
          - name: Windows x86_64
            os: windows-latest
            arch: x86_64
            cmake_extra_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -G "MinGW Makefiles"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Install Tools
        uses: aminya/setup-cpp@v1
        with:
          gcc: true
          cmake: true
          gcovr: true
          ninja: true
          setup-cpp: false
      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libopenblas-dev
      - name: Configure CMake
        run: cmake -B ./build --preset=conf-dev "-DCMAKE_CXX_FLAGS=--coverage" "-DCMAKE_C_FLAGS=--coverage" "-DCMAKE_EXE_LINKER_FLAGS=--coverage" ${{ matrix.cmake_extra_args }}
      - name: Build
        run: cmake --build ./build
      - name: Run Tests
        run: ctest --test-dir ./build --output-on-failure
      - name: Generate Coverage Report
        run: gcovr --root . --xml coverage.xml --filter 'src/' --filter 'include/'
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.arch }}
          name: ${{ matrix.name }}
          fail_ci_if_error: true

  tooling:
    # The frontend and the tooling (mdl-format, mdls) without the compiler: no TVM/LLVM/oneDNN, so it builds with each
    # platform's native toolchain (MSVC on Windows). These are the binaries the editor integration ships.
    name: Tooling (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-latest
          - name: macOS x86_64
            os: macos-13
          - name: Windows x86_64 (MSVC)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Install Java (ANTLR code generation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure CMake
        run: cmake -B ./build --preset=conf-tooling
      - name: Build
        run: cmake --build ./build --config Release --parallel
      - name: Run Tests
        run: ctest --test-dir ./build --build-config Release --output-on-failure
      - name: Check the Format of the .dlm Files
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: ./build/src/commands/mdl-format --check $(git ls-files '*.dlm')

  linters:
    name: Run C++ Linters
    runs-on: ubuntu-latest
    steps:
      - name: Install Compiler and Cpp Tools
        uses: aminya/setup-cpp@v1
        with:
          clang-tidy: "19.1.0"
          cmake: true
          setup-cpp: false
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Configure CMake
        run: cmake -B ./build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run Clang-Tidy
        working-directory: ${{github.workspace}}
        run: clang-tidy-19 -p ./build/compile_commands.json $(find src/ include/ -type f -iregex '^.*\.\(c\|h\|cpp\|hpp\|cc\|hh\)$')

  format-checks:
    name: Check C++ code format
    runs-on: ubuntu-latest
    steps:
      - name: Install Compiler and Cpp Tools
        uses: aminya/setup-cpp@v1
        with:
          clang-format: "19.1.0"
          setup-cpp: false
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Check Codestyle
        working-directory: ${{github.workspace}}
        run: find src/ include/ -type f -iregex '^.*\.\(c\|h\|cpp\|hpp\|cc\|hh\)$' | xargs clang-format-19 --dry-run --Werror --Wno-error=unknown
