name: Run C++ Tests, Linters, and Format Checks

on:
  push:

jobs:
  tests:
    # The compiler (TVM with LLVM, oneDNN) and all tests, including the examples. Linux only: TVM needs an LLVM
    # installation that the macOS and Windows runners do not provide; the frontend and the tooling are tested on all
    # platforms by the tooling job. A Release build (TVM in Debug with coverage takes hours).
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Install LLVM and Ninja
        run: sudo apt-get update && sudo apt-get install -y llvm-dev ninja-build
      - name: Configure CMake
        run: cmake -B ./build --preset=conf-release-static-deps -G Ninja
      - name: Build
        run: cmake --build ./build --parallel
      - name: Run Tests
        run: ctest --test-dir ./build --output-on-failure --parallel 4
      # The packages themselves (the release workflow builds and tries all formats): a change that breaks the
      # installation or the CPack configuration fails here, not at the next release.
      - name: Build the Packages (tar.gz and deb)
        working-directory: ./build
        run: cpack -G "TGZ;DEB" -B ../packages

  tooling:
    # The frontend and the tooling (mdl-format, mdls) without the compiler: no TVM/LLVM/oneDNN, so it builds with each
    # platform's native toolchain (MSVC on Windows). These are the binaries the editor integration ships.
    name: Tooling (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-latest
          - name: Windows x86_64 (MSVC)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Install Java (ANTLR code generation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Ninja (if missing)
        shell: bash
        run: command -v ninja || pipx install ninja || python3 -m pip install ninja || python -m pip install ninja
      - name: Set Up MSVC (Windows; Ninja uses the compiler of the environment)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure CMake
        run: cmake -B ./build --preset=conf-tooling
      - name: Build
        run: cmake --build ./build --config Release --parallel
      - name: Run Tests
        run: ctest --test-dir ./build --build-config Release --output-on-failure
      - name: Coverage of the Frontend and the Tooling (Linux x86_64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          pip install gcovr
          cmake -B ./coverage --preset=conf-tooling -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=--coverage" "-DCMAKE_C_FLAGS=--coverage" "-DCMAKE_EXE_LINKER_FLAGS=--coverage"
          cmake --build ./coverage --parallel
          ctest --test-dir ./coverage --output-on-failure
          gcovr --root . --object-directory ./coverage --xml coverage.xml --filter 'src/' --filter 'include/'
      - name: Upload Coverage to Codecov (Linux x86_64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          name: frontend
          fail_ci_if_error: true
      - name: Check the Format of the .dlm Files
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: ./build/src/commands/mdl-format --check $(git ls-files '*.dlm')

  linters:
    name: Run C++ Linters
    runs-on: ubuntu-latest
    steps:
      - name: Install Compiler and Cpp Tools
        uses: aminya/setup-cpp@v1
        with:
          clang-tidy: "19.1.0"
          cmake: true
          setup-cpp: false
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Configure CMake (frontend and tooling; the sources need the generated parser)
        run: |
          cmake -B ./build --preset=conf-tooling -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build ./build --target mdl_frontend --parallel
      - name: Run Clang-Tidy
        working-directory: ${{github.workspace}}
        # The translation units of the frontend and the tooling (headers are checked through them; TVM's are not).
        run: |
          clang-tidy -quiet -p ./build/compile_commands.json $(find src/mdls src/mdl/analysis src/mdl/computegraph \
            src/mdl/format src/mdl/parser src/mdl/utils src/commands/mdl-format.cpp src/commands/mdls.cpp \
            src/mdl/parser.cpp src/mdl/diagnostics.cpp src/mdl/namespace.cpp src/mdl/passes/shapes.cpp -name '*.cpp')

  format-checks:
    name: Check C++ code format
    runs-on: ubuntu-latest
    steps:
      - name: Install Compiler and Cpp Tools
        uses: aminya/setup-cpp@v1
        with:
          clang-format: "19.1.0"
          setup-cpp: false
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Check Codestyle
        working-directory: ${{github.workspace}}
        run: find src/ include/ -type f -iregex '^.*\.\(c\|h\|cpp\|hpp\|cc\|hh\)$' | xargs clang-format --dry-run --Werror --Wno-error=unknown
