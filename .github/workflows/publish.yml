# Release builds of the tooling (mdl-format, mdls, and the standard library) for every platform the editor integration
# supports. Each platform is built and tested; the archives have the layout bin/mdl-format, bin/mdls, share/mdl/std/.
#
# - A tag vX.Y.Z (or vX.Y.Z-suffix, a prerelease) publishes a GitHub release with the archives and SHA256SUMS.
# - A push to main updates the rolling `nightly` prerelease.
#
# Portability: Linux binaries are built on glibc 2.28 (manylinux_2_28) with libstdc++ and libgcc linked statically, so
# they run on any distribution with glibc >= 2.28; Windows binaries use the static C runtime; macOS binaries target
# macOS 13.3 (std::format, std::expected) and are signed and notarized if the signing secrets are set.
name: Publish Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tools:
    name: Tools (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - platform: darwin-x64
            os: macos-13
          - platform: darwin-arm64
            os: macos-latest
          - platform: win32-x64
            os: windows-latest
          - platform: win32-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - name: Checkout Repository (with tags, for the version)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trust the Repository (git in the container runs as another user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash

      # ── Toolchains ──────────────────────────────────────────────────────────────────────────────
      - name: Install Java (ANTLR code generation) and Check the Compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          dnf install -y java-17-openjdk-headless
          gcc --version
          # C++23 (std::format, std::expected) needs GCC 13 or newer.
          test "$(gcc -dumpversion | cut -d. -f1)" -ge 13
      - name: Install Java (ANTLR code generation)
        if: runner.os != 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set Up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform == 'win32-arm64' && 'arm64' || 'x64' }}

      # ── Build and test ──────────────────────────────────────────────────────────────────────────
      - name: Configure
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   extra=(-DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc") ;;
            Windows) extra=(-G Ninja -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl) ;;
            macOS)   extra=(-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3) ;;
          esac
          cmake --preset conf-tooling -B build "${extra[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Check the Linux Binaries (glibc <= 2.28, no shared libstdc++/libgcc)
        if: runner.os == 'Linux'
        run: |
          for tool in build/src/commands/mdl-format build/src/commands/mdls; do
            newest=$(objdump -T "$tool" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
            echo "$tool needs $newest"
            test "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.28"
            ! ldd "$tool" | grep -E 'libstdc\+\+|libgcc_s'
          done

      # ── Package ─────────────────────────────────────────────────────────────────────────────────
      - name: Install
        run: cmake --install build --config Release --component tools --prefix dist/mdl-tools-${{ matrix.platform }}
      - name: Sign and Notarize (macOS, if the secrets are set)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          for tool in dist/mdl-tools-${{ matrix.platform }}/bin/*; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$tool"
          done
          ditto -c -k dist/mdl-tools-${{ matrix.platform }} notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" --wait
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -C dist -czf mdl-tools-${{ matrix.platform }}.tar.gz mdl-tools-${{ matrix.platform }}
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/mdl-tools-${{ matrix.platform }} -DestinationPath mdl-tools-${{ matrix.platform }}.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mdl-tools-${{ matrix.platform }}
          path: mdl-tools-${{ matrix.platform }}.*

  release:
    name: Publish
    needs: tools
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Download the Archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum mdl-tools-* > SHA256SUMS && cat SHA256SUMS
      - name: Move the Nightly Tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f nightly
          git push -f origin refs/tags/nightly
      - name: Publish the Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
      - name: Publish the Nightly Release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          body: The tooling built from the latest commit on main (${{ github.sha }}).
          files: artifacts/*
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
