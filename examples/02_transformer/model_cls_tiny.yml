# The tiny BERT of model_bert_tiny.yml with a classification head of 3 classes (data/bert_tiny_cls.safetensors), and
# its builds (see docs/build-config.md): inference, training with the loss as objective, and the logits as a PyTorch
# autograd function (examples/07_pytorch_training).
args:
  BertForSequenceClassification:
    conf:
      dims:
        model: 32
        key: 8
        value: 8
        inner: 64
      numEncoders: 2
      numAttnHeads: 4
    emb:
      vocab: 100
      positions: 16
      types: 2
    classes: 3

build:
  ellipsis-rank: { default: 2, labels: 1 }   # ids [batch, seq], labels [batch]
  mask: [logits]

builds:
  inference: {}
  train:
    mask: [logits, loss]
    grad: [loss]
  autograd:
    grad: [logits]
